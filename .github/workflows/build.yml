name: Build and Push API Image
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download ZIP from Hugging Face
        run: |
          wget -q https://huggingface.co/datasets/Rajunknown19/tg-data/resolve/main/Telegram-full-database-json.zip -O data.zip
          unzip -q data.zip
          find . -name "*.json" -exec mv {} Telegram_70M.json \;
          rm data.zip
          
      - name: Install Python & Build DB
        run: |
          pip install ijson
          python build_db.py
          rm Telegram_70M.json
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rajunknown1919
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Build and Push Docker Image
        run: |
          docker build -t rajunknown1919/tg-api:latest .
          docker push rajunknown1919/tg-api:latest
          
